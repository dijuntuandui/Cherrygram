
// [Aiqiyi] 官方源优先，阿里云镜像降级为兜底。
// 早期配置是镜像优先以绕开 gradlePluginPortal -> github.com/JetBrains/*/releases 的 504，
// 但 GitHub Actions runner 在海外，走国内镜像反而经常拿到 502（.pom 拉不到），
// 且 Gradle 的规则是「一个仓库连接出错就整体标记不可用」，会连锁掉 50+ 依赖。
// 改成官方源在前、镜像在后：海外直连最快，官方源真的挂了才落到镜像。
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

include ':TMessagesProj'
include ':TMessagesProj_App'
include ':TMessagesProj_AppHuawei'
include ':TMessagesProj_AppHockeyApp'
include ':TMessagesProj_AppStandalone'
include ':TMessagesProj_AppTests'
include ':jlatexmath'
project(':jlatexmath').projectDir = new File(rootDir, 'TMessagesProj/lib/jlatexmath/jlatexmath')

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // [Aiqiyi] 镜像放最后兜底，避免海外 runner 命中 502 后整仓被禁用。
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
apply from: file("TMessagesProj_Modules/media/core_settings.gradle")