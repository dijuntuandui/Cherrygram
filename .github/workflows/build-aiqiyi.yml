name: Build Aiqiyi APK

on:
  workflow_dispatch:
  push:
    branches: [ aiqiyi-ui, aiqiyi-local, aiqiyi-sync, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # [Aiqiyi] runner 磁盘不够，mergeReleaseNativeLibs 会报 No space left on device。
      # 先清掉 runner 预装的无关 SDK/NDK/Docker/大型工具链，能腾出一十几 GB。
      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/26.* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/24.* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/23.* || true
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-2* || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images || true
          sudo rm -rf /usr/local/lib/android/sdk/emulator || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/8* || true
          sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/11* || true
          sudo rm -rf /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21* || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/aws-cli || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo apt-get clean || true
          docker image prune -af || true
          docker system prune -af || true
          echo "=== after ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (with NDK 27.2)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools cmake;3.22.1 ndk;27.2.12479018'

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > Your_Key.jks
          ls -la Your_Key.jks

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018" >> local.properties
          cat local.properties
          : > secrets_for_ci.env
          echo "secrets_for_ci.env created (empty)"

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --parallel -Dorg.gradle.jvmargs=-Xmx6g :TMessagesProj_App:assembleAfatRelease

      - name: Locate outputs
        run: |
          mkdir -p out
          find . -path ./.git -prune -o -name '*.apk' -type f -print 2>/dev/null | head -50
          find . -path ./.git -prune -o -name '*.apk' -type f -exec cp {} out/ \; 2>/dev/null || true
          ls -lah out/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aqy-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 7

      # [Aiqiyi] artifact API 下载慢且必须鉴权，额外发一份到 Release，走 CDN 直链方便手机直接下
      - name: Publish to Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk \
            --title "Aiqiyi build ${GITHUB_RUN_NUMBER}" \
            --notes "Auto build from ${GITHUB_SHA}" \
            --repo "$GITHUB_REPOSITORY" || true
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' || true