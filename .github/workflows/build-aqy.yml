name: Build Aiqiyi APK

on:
  workflow_dispatch:
  push:
    branches: [ repro ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools cmake;3.22.1 ndk;27.3.13750724'

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          : > secrets_for_ci.env
          echo "secrets_for_ci.env created (empty)"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --parallel -Dorg.gradle.jvmargs=-Xmx6g :TMessagesProj_App:assembleAfatRelease

      - name: Locate outputs
        run: |
          mkdir -p out
          find . -path ./.git -prune -o -name '*.apk' -type f -print 2>/dev/null | head -50
          find . -path ./.git -prune -o -name '*.apk' -type f -exec cp {} out/ \; 2>/dev/null || true
          ls -lah out/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aqy-apk
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 7
